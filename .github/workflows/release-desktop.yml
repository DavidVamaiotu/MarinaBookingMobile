name: Release desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'DavidVamaiotu/MarinaBookingDesktop'
    runs-on: windows-latest
    env:
      MARINA_INTEGRATION_ENABLED: "true"
      MARINA_API_BASE_URL: https://booking.husi.ro
      MARINA_OAUTH_CLIENT_ID: ${{ vars.MARINA_OAUTH_CLIENT_ID || secrets.MARINA_OAUTH_CLIENT_ID }}
      MARINA_OAUTH_SCOPES: resources:read resources:write bookings:read bookings:write
      MARINA_ROOMS_WORKSPACE_ID: ${{ vars.MARINA_ROOMS_WORKSPACE_ID }}
      MARINA_CAMPING_WORKSPACE_ID: ${{ vars.MARINA_CAMPING_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-release-version.js
      - run: npm run check
      - run: npm test
      - run: node scripts/verify-public-config.js
      - run: npm run dist
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist-electron/MarinaBookingDesktop-Setup-*.exe dist-electron/MarinaBookingDesktop-Setup-*.exe.blockmap dist-electron/latest.yml --title "Marina Booking Desktop $GITHUB_REF_NAME" --generate-notes
